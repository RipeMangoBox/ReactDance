results_root: results/lightning_log
data:
  root: data_lazy
  num_workers: 4
  train:
    split: train
    interval: 240
    move: 4
    batch_size: 256
  val:
    split: test
    interval: null
    move: 4
    batch_size: 1
  test:
    split: test
    move: 4
train:
  epochs: 1213
  checkpoint_every: 50
  evaluate_every: 50
  accumulate_grad_batches: 1
  gradient_clip: 1.0
  optimizer:
    name: Lion
    lr: 3.0e-05
    betas:
    - 0.9
    - 0.99
    weight_decay: 0.002
  lr_decay: 0.9995081034153087
trainer:
  accelerator: gpu
  devices:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  precision: 16
  limit_train_batches: 1.0
  log_every_n_steps: 10
seed: 325514
model:
  name: FullBody_HFSQ
  unified_params:
    sample_length: 240
    commit: 0.02
    Encdec:
      downs_t:
      - 2
      strides_t:
      - 2
      multipliers:
      - 1
      width: 512
      depth: 3
      m_conv: 1.0
      dilation_growth_rate: 3
      reverse_decoder_dilation: true
    Bottleneck:
      bottleneck_name: HFSQ_BottleneckBlock
      HFSQ_BottleneckBlock:
        levels:
        - 8
        - 5
        - 5
        - 5
        groups: 8
        num_quantizers: 2
        use_group_norm: false
        group_norm_type: LayerNorm
        latent_loss_type: commit
        base_mask_rate: 0.1
        RFSQ:
          separate_project_out: false
          use_residual_norm: true
          norm_type: LayerNorm
          quantize_dropout_prob: 0.2
          r_rand_scale: 0.01
          w_scale_dividison: false
          FSQ:
            use_norm: true
            norm_type: LayerNorm
            noise_type: gaussian
      RVQ_BottleneckBlock:
        num_quantizers: 2
        sample_codebook_temp: 0.5
        shared_codebook: false
        quantize_dropout_prob: 0.2
        quantize_dropout_cutoff_index: 0
        nb_code: 1024
        mu: 0.99
  up_half:
    pos_channel: 39
    vel: 1
    acc: 1
  down_half:
    pos_channel: 27
    vel: 1
    acc: 1
  tr_half:
    pos_channel: 3
    vel: 1
    acc: 1
  joint_channel: 3
  dim: 128
