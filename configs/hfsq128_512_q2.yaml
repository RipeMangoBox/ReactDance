expname: HFSQ
structure:
    name: FullBody_HFSQ
    unified_params:
        sample_length: 240  # not used
        commit: 0.02
        Encdec:
            downs_t: [2,]
            strides_t: [2,]
            multipliers: [1,]
            width: 512
            depth: 3
            m_conv: 1.0
            dilation_growth_rate: 3
            reverse_decoder_dilation: True
        Bottleneck:
            bottleneck_name: HFSQ_BottleneckBlock
            HFSQ_BottleneckBlock:
                levels: [8,5,5,5]
                groups: 8
                num_quantizers: 2
                use_group_norm: False
                group_norm_type: LayerNorm
                latent_loss_type: commit
                base_mask_rate: 0.1                   # Robust
                RFSQ:
                    separate_project_out: False         # Non-Robust, but counts!
                    use_residual_norm: True
                    norm_type: LayerNorm
                    quantize_dropout_prob: 0.2              # Robust
                    # fsq_dropout_base_rate: 0
                    r_rand_scale: 0.01                  # Robust
                    w_scale_dividison: False

                    FSQ:
                        use_norm: True
                        norm_type: LayerNorm
                        noise_type: gaussian

            RVQ_BottleneckBlock:
                num_quantizers: 2
                sample_codebook_temp: 0.5
                shared_codebook: False
                quantize_dropout_prob: 0.2
                quantize_dropout_cutoff_index: 0
                nb_code: 1024
                mu: 0.99
                
    up_half:
        pos_channel: 39
        vel: 1
        acc: 1
    down_half:
        pos_channel: 27
        vel: 1
        acc: 1
    tr_half:
        pos_channel: 3
        vel: 1
        acc: 1
    joint_channel: 3
    dim: 128

## Training Configs are separate into 3 parts: data, manual control, pl config'''
### data part in training'''
data:
    num_joints: 22
    train:
        music_root: ./data_lazy/music
        data_root: ./data_lazy/motion
        shuffle: True
        move: 4
        dtype: ['pos3d']
        split: train
        interval: 240
        batch_size: 512

    test:
        music_root: ./data_lazy/music
        data_root: ./data_lazy/motion
        music_source: ./data_lazy/music/mp3/all/
        checkpoint: null    # put trained stage one ckpt here!
        move: 4
        dtype: ['pos3d']
        split: test
        interval: None  # set interval to None to use full length evaluation and reconstruction
        batch_size: 1

Train:
    log_steps: 500
    last_iter: 0
    accumulate_grad_batches: 1
    resume_from_checkpoint: null    # put resume training ckpt here!
    checkpoint_interval: 25 # ckpt saving frequency
    use_amp: True
    max_clip_norm: 1
    use_scaler: True

    optimizer:
        type: Lion
        Adam:
            lr: 1e-4 # 0.00003
            betas: [0.5, 0.999]
            weight_decay: 0.0002
        Lion:
            lr: 3e-5 # 0.00003
            betas: [0.9, 0.99]
            weight_decay: 0.002
        Adan:
            lr: 6e-4 # 0.00003
            betas: [0.98, 0.92, 0.99]
            weight_decay: 0.0002
            foreach: False
    scheduler:
        type: LRFactor # choice = [CosineWarmupScheduler, LRFactor]
        total_epochs: 301
        LRFactor:
            decay_factor: 0.998
        CosineWarmupScheduler:
            warmup: 0
            cosine_epochs: 301  # control the length of cos cycle
            stable_epochs: 0
            eta_min: 1e-7 # 0.000001
            default_min_lr: 1e-7

### pl config part in training'''
Trainer:
    accelerator: gpu
    devices: [0]
    default_root_dir: results/training/HFSQ/
    # gradient_clip_val: 25
    deterministic: false
    fast_dev_run: false
    # max_epochs: 500
    min_epochs: 1
    precision: 32  # half precision for acceleration'''
    