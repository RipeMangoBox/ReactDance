results_root: results/lightning_log
data:
  root: data_lazy
  num_workers: 4
  train:
    split: train
    interval: 240
    move: 4
    batch_size: 384
  val:
    split: test
    interval: 240
    move: 32
    batch_size: 128
  test:
    split: test
    move: 32
train:
  epochs: 1000
  checkpoint_every: 50
  evaluate_every: 50
  accumulate_grad_batches: 1
  gradient_clip: 1.0
  optimizer:
    name: AdamW
    eps: 1.0e-6
    lr: 0.0002
    betas:
    - 0.5
    - 0.999
    weight_decay: 0.0002
  lr_decay: 0.998
trainer:
  accelerator: gpu
  devices:
  - 0
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  - 7
  precision: bf16
  limit_train_batches: 19
  log_every_n_steps: 10
seed: 42
model:
  gaussian: GaussianDiffusion
  denoiser: ReactDance_Denoiser
  beta_scheduler: cosine
  prior_mode: all_quantizeds
  attn_mask_type: interval
  use_rotary: false
  music_time_merged: true
  pos_allq_shape:
  - 8
  - 2
  - 48
  token_block_size: 60
  latent_dim: 1024
  latent_loss_weight:
  - 2.0
  - 1.0
  clip_scaler: 100.0
  loss_fn: l1
  normalizer_calculator: Z_SCORE
  guidance_drop_mode: zero
  geo_loss_checklist:
    use_GEO: true
    w_recon: 0.1
    w_vel: 0.1
    w_acc: 0.1
    w_FC: 0.1
    w_RO: 0.01
    w_DM: 0.05
    w_JA: 0.05
    w_TR_recon: 0.05
    w_TR_vel: 0.05
    w_TR_acc: 0.05
  unified_params:
    n_cond: 512
    n_embd: 768
    ff_size: 2048
    spatial_ds_rate: 1.0
    attn_pdrop: 0.1
    embd_pdrop: 0.1
    resid_pdrop: 0.1
    block_backend: SelfAttentionBlock
  m_cond_drop_prob: 0.1
  p_cond_drop_prob: 0.1
  gpt:
    dropout: 0.1
    n_layer: 8
    n_head: 8
    activation: gelu
    mask_type: mix
    sa_backend: QKNORMSA
    ca_backend: QKNORMCA
  music_trans:
    n_cond: 54
    n_layer: 2
    temp_ds_rate: 4
    n_head: 8
  leader_pos_trans:
    n_cond: 66
    n_layer: 2
    temp_ds_rate: 4
    n_head: 8
  random_block_phase: true
hfsq_checkpoint: results/lightning_log/HFSQ/latest/last.ckpt
