name: reactdance
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # --- Core runtime ---
  - python=3.8
  - pip

  # --- PyTorch (match paper setup) ---
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=12.1

  # --- Visualization / video export (optional but commonly needed) ---
  - ffmpeg

  # --- Python packages ---
  - pip:
      # training / infra
      - lightning==1.9.1
      - lightning.cloud==0.5.70
      - easydict==1.13
      - pyyaml==6.0.2
      - tqdm==4.67.0

      # numerics / metrics
      - numpy==1.21.6
      - scipy==1.10.1
      - pandas==2.0.3
      - scikit-learn==1.3.2

      # model utils
      - einops==0.8.0
      - einx==0.3.0
      - yacs==0.1.8

      # audio features
      - librosa==0.8.0
      - soundfile==0.12.1
      - essentia==2.1b6.dev1110

      # rendering / visualization helpers
      - matplotlib==3.1.1
      - opencv-python==4.10.0.84
      - moviepy==1.0.3
      - imageio==2.5.0
      - imageio-ffmpeg==0.5.1
      - trimesh==4.5.2
      - pyrender==0.1.45
      - pyglet==2.0.18
      - pyopengl==3.1.0
      - smplx==0.1.28

      # logging
      - tensorboard==2.14.0

